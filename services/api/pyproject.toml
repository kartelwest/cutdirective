[project]
name = "cutdirective-api"
version = "0.1.0"
description = "CutDirective AI API service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "openai==1.30.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "vosk>=0.3.45",
]

[project.scripts]
api = "app.main:main"

[tool.uv]
package = false
