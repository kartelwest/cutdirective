services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - CUTDIRECTIVE_ROOT=/app/CutDirective
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/cutdirective.db
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - cutdirective-data:/app/data
      - cutdirective-workspace:/app/CutDirective

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - API_URL=http://api:8000
      - CUTDIRECTIVE_ROOT=/app/CutDirective
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/cutdirective.db
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - WORKER_ID=worker-001
      - WORKER_POLL_INTERVAL=5
    volumes:
      - cutdirective-data:/app/data
      - cutdirective-workspace:/app/CutDirective
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  cutdirective-data:
  cutdirective-workspace:
